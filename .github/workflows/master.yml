name: Master CI/CD
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.19.1]
    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}
    - name: npm install, build, lint and test
      run: |
        npm install
        npm run build --if-present
        npm run lint --if-present
        npm run test --if-present
      env:
        CI: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Check Out Repo
      uses: actions/checkout@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      id: docker_build
      uses: docker/build-push-action@v2
      with:
        context: ./
        file: ./Dockerfile
        push: true
        tags: ecency/hivesigner-api:latest

    - name: Image digest
      run: echo ${{ steps.docker_build.outputs.digest }}

    - name: SSH and deploy API container
      uses: appleboy/ssh-action@5711a203b3207eb1c6cebec6ac2152ab210ec3ae
      env:
        BROADCAST_NETWORK: ${{secrets.BROADCAST_NETWORK}}
        BROADCASTER_USERNAME: ${{secrets.BROADCASTER_USERNAME}}
        BROADCASTER_POSTING_WIF: ${{secrets.BROADCASTER_POSTING_WIF}}
        API_PORT: ${{secrets.API_PORT}}
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        envs: BROADCAST_NETWORK,BROADCASTER_USERNAME,BROADCASTER_POSTING_WIF,API_PORT
        script: |
          cd ~/hsapi
          git pull origin main
          export API_PORT=$API_PORT
          export BROADCAST_NETWORK=$BROADCAST_NETWORK
          export BROADCASTER_USERNAME=$BROADCASTER_USERNAME
          export BROADCASTER_POSTING_WIF=$BROADCASTER_POSTING_WIF
          # One-time: this host ran the API under pm2 before the move to swarm.
          # Without this both the old process and the swarm task bind $API_PORT
          # on the first deploy and one of them loses. Harmless once pm2 has no
          # such process, which is why it is not guarded by anything cleverer.
          pm2 delete api || true
          # `docker stack deploy` resolves the tag itself; the explicit pull is
          # redundant. It stays only so the image is warm before the swarm
          # update starts, which shortens the start-first window.
          docker pull ecency/hivesigner-api:latest
          docker stack deploy -c docker-compose.yml hivesigner-api
          # `stack deploy` returns as soon as the update is ACCEPTED, so without
          # a wait the workflow reports success over a task that never starts.
          #
          # Waiting on `docker service ps --filter desired-state=running` is NOT
          # enough: with `order: start-first` the OLD task is still desired-running
          # through the rollout, so that check can pass on the task being replaced
          # before the new one has run at all. UpdateStatus is about the update
          # itself, which is the actual question being asked.
          for i in $(seq 1 30); do
            state=$(docker service inspect hivesigner-api_api --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{else}}none{{end}}' 2>/dev/null || echo unknown)
            case "$state" in
              completed|none)
                echo "update state: $state"
                docker service ps hivesigner-api_api --filter desired-state=running
                exit 0 ;;
              rollback_started|rollback_completed|paused)
                echo "update did not take: $state"
                docker service ps hivesigner-api_api --no-trunc | head -5
                exit 1 ;;
            esac
            sleep 5
          done
          echo "update did not complete in time:"
          docker service ps hivesigner-api_api --no-trunc | head -5
          exit 1
