name: Master CI/CD
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.19.1]
    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}
    - name: npm install, build, lint and test
      run: |
        npm install
        npm run build --if-present
        npm run lint --if-present
        npm run test --if-present
      env:
        CI: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Check Out Repo
      uses: actions/checkout@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      id: docker_build
      uses: docker/build-push-action@v2
      with:
        context: ./
        file: ./Dockerfile
        push: true
        tags: ecency/hivesigner-api:latest

    - name: Image digest
      run: echo ${{ steps.docker_build.outputs.digest }}

    - name: SSH and deploy API container
      uses: appleboy/ssh-action@5711a203b3207eb1c6cebec6ac2152ab210ec3ae
      env:
        BROADCAST_NETWORK: ${{secrets.BROADCAST_NETWORK}}
        BROADCASTER_USERNAME: ${{secrets.BROADCASTER_USERNAME}}
        BROADCASTER_POSTING_WIF: ${{secrets.BROADCASTER_POSTING_WIF}}
        API_PORT: ${{secrets.API_PORT}}
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        envs: BROADCAST_NETWORK,BROADCASTER_USERNAME,BROADCASTER_POSTING_WIF,API_PORT
        script: |
          cd ~/hsapi
          git pull origin main
          export API_PORT=$API_PORT
          export BROADCAST_NETWORK=$BROADCAST_NETWORK
          export BROADCASTER_USERNAME=$BROADCASTER_USERNAME
          export BROADCASTER_POSTING_WIF=$BROADCASTER_POSTING_WIF
          # One-time: this host ran the API under pm2 before the move to swarm.
          # Without this both the old process and the swarm task bind $API_PORT
          # on the first deploy and one of them loses. Harmless once pm2 has no
          # such process, which is why it is not guarded by anything cleverer.
          # `pm2 delete` alone leaves the SAVED dump intact, so on a host with
          # `pm2 startup` configured the old process comes back after a reboot
          # and binds the port again. `pm2 save` rewrites the dump without it.
          { pm2 delete api && pm2 save; } || true
          # Not needed for correctness - `docker stack deploy` resolves the tag
          # itself. It pulls the layers before the swarm update starts, so the
          # start-first window is shorter than if the new task pulled them.
          docker pull ecency/hivesigner-api:latest
          docker stack deploy -c docker-compose.yml hivesigner-api
          # `stack deploy` returns as soon as the update is ACCEPTED, so without
          # a wait the workflow reports success over a task that never starts.
          #
          # Is a task running THE IMAGE THIS DEPLOY ASKED FOR?
          #
          # `--filter desired-state=running` alone is not an answer: under
          # start-first the OUTGOING task is still desired-running, so both a
          # `completed` left over from the previous deploy and a reset `none`
          # could be answered by the task being replaced.
          #
          # Compared against the SERVICE SPEC's image rather than the digest the
          # build job pushed. Those two are not the same string - swarm resolves
          # the tag itself and records its own digest, which differs from what
          # buildx reports pushing - so matching the pushed digest would fail
          # EVERY deploy, which is a worse failure than the one being fixed.
          # `stack deploy` writes the newly resolved image into the spec, so the
          # spec names the incoming image while the outgoing task still carries
          # the previous one. Verified: mid-rollout the old task is Running on
          # the old image and this correctly reports not-yet.
          #
          # Publishes the matching task's id, because the health check below has
          # to read THAT task's container rather than whichever one docker lists
          # first - during a start-first rollout that can be the outgoing one.
          TASK_ID=
          running() {
            TASK_ID=
            want=$(docker service inspect hivesigner-api_api \
              --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' 2>/dev/null) || return 1
            [ -n "$want" ] || return 1
            TASK_ID=$(docker service ps hivesigner-api_api --no-trunc \
              --filter desired-state=running \
              --format '{{.ID}} {{.CurrentState}} {{.Image}}' 2>/dev/null \
              | awk -v want="$want" '$2 == "Running" && index($0, want) { print $1; exit }')
            [ -n "$TASK_ID" ]
          }
          # Then the container's health: 0 healthy, 1 unhealthy, 2 not readable
          # on this node, 3 still starting. A container with no healthcheck has
          # nothing to wait for.
          #
          # Measured on docker 29: a task with a HEALTHCHECK is not reported
          # Running until health has passed, so this is usually a second look at
          # something already true. It is kept because that ordering is the
          # engine's behaviour rather than a documented guarantee, and reading it
          # costs one inspect.
          health() {
            [ -n "$TASK_ID" ] || return 2
            cid=$(docker ps -q \
              --filter "label=com.docker.swarm.task.id=$TASK_ID" \
              2>/dev/null | head -1)
            [ -n "$cid" ] || return 2
            status=$(docker inspect -f \
              '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
              "$cid" 2>/dev/null || echo unknown)
            case "$status" in
              healthy|none) return 0 ;;
              unhealthy) return 1 ;;
              *) return 3 ;;
            esac
          }
          # Long enough to cover the healthcheck's start period and first probes.
          for i in $(seq 1 40); do
            state=$(docker service inspect hivesigner-api_api --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{else}}none{{end}}' 2>/dev/null || echo unknown)
            case "$state" in
              rollback_started|rollback_completed|rollback_paused|paused)
                echo "update did not take: $state"
                docker service ps hivesigner-api_api --no-trunc | head -5
                exit 1 ;;
            esac
            # BOTH paths require a running task on the image this deploy asked
            # for, so neither the previous deploy's `completed` nor a reset
            # `none` can be satisfied by the outgoing task.
            if running; then
              health
              case "$?" in
                0)
                  echo "deploy ok (update state: $state)"
                  docker service ps hivesigner-api_api --filter desired-state=running
                  exit 0 ;;
                1)
                  echo "container is unhealthy"
                  docker service ps hivesigner-api_api --no-trunc | head -5
                  exit 1 ;;
                2)
                  # The task is running, but no local container carries its id -
                  # it is on another node, so its health cannot be read from
                  # here. Fall back to the update state, which is the best
                  # signal available in that case.
                  if [ "$state" = "completed" ]; then
                    echo "deploy ok (update completed; task not on this node)"
                    exit 0
                  fi ;;
              esac
            fi
            sleep 5
          done
          echo "service did not become healthy in time:"
          docker service ps hivesigner-api_api --no-trunc | head -5
          docker ps --filter "label=com.docker.swarm.service.name=hivesigner-api_api" \
            --format '{{.Names}} {{.Status}}' || true
          exit 1
