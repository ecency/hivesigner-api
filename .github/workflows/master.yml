name: Master CI/CD
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.19.1]
    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}
    - name: npm install, build, lint and test
      run: |
        npm install
        npm run build --if-present
        npm run lint --if-present
        npm run test --if-present
      env:
        CI: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Check Out Repo
      uses: actions/checkout@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      id: docker_build
      uses: docker/build-push-action@v2
      with:
        context: ./
        file: ./Dockerfile
        push: true
        tags: ecency/hivesigner-api:latest

    - name: Image digest
      run: echo ${{ steps.docker_build.outputs.digest }}

    - name: SSH and deploy API container
      uses: appleboy/ssh-action@5711a203b3207eb1c6cebec6ac2152ab210ec3ae
      env:
        BROADCAST_NETWORK: ${{secrets.BROADCAST_NETWORK}}
        BROADCASTER_USERNAME: ${{secrets.BROADCASTER_USERNAME}}
        BROADCASTER_POSTING_WIF: ${{secrets.BROADCASTER_POSTING_WIF}}
        API_PORT: ${{secrets.API_PORT}}
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        envs: BROADCAST_NETWORK,BROADCASTER_USERNAME,BROADCASTER_POSTING_WIF,API_PORT
        script: |
          cd ~/hsapi
          git pull origin main
          export API_PORT=$API_PORT
          export BROADCAST_NETWORK=$BROADCAST_NETWORK
          export BROADCASTER_USERNAME=$BROADCASTER_USERNAME
          export BROADCASTER_POSTING_WIF=$BROADCASTER_POSTING_WIF
          # One-time: this host ran the API under pm2 before the move to swarm.
          # Without this both the old process and the swarm task bind $API_PORT
          # on the first deploy and one of them loses. Harmless once pm2 has no
          # such process, which is why it is not guarded by anything cleverer.
          pm2 delete api || true
          # `docker stack deploy` resolves the tag itself; the explicit pull is
          # redundant. It stays only so the image is warm before the swarm
          # update starts, which shortens the start-first window.
          docker pull ecency/hivesigner-api:latest
          docker stack deploy -c docker-compose.yml hivesigner-api
          # `stack deploy` returns as soon as the update is ACCEPTED, so without
          # a wait the workflow reports success over a task that never starts.
          #
          # Waiting on `docker service ps --filter desired-state=running` is NOT
          # enough: with `order: start-first` the OLD task is still desired-running
          # through the rollout, so that check can pass on the task being replaced
          # before the new one has run at all. UpdateStatus is about the update
          # itself, which is the actual question being asked.
          # A task actually in Running. `--filter desired-state=running` alone
          # is not an answer: during a start-first update the OUTGOING task is
          # still desired-running, which is why the update state gates an
          # update. On a first deploy there is no update and no old task, so
          # this is the right question there.
          running() {
            docker service ps hivesigner-api_api \
              --filter desired-state=running --format '{{.CurrentState}}' \
              2>/dev/null | grep -q '^Running'
          }
          # Running is NOT ready. A swarm task reports Running as soon as the
          # container starts, which is before the image's HEALTHCHECK has left
          # its start period - so a container with a broken health endpoint
          # could make this workflow succeed and then go unhealthy and restart
          # behind it. 0 healthy, 1 unhealthy, 2 not on this node, 3 still
          # starting. A container with no healthcheck has nothing to wait for.
          health() {
            cid=$(docker ps -q \
              --filter "label=com.docker.swarm.service.name=hivesigner-api_api" \
              2>/dev/null | head -1)
            [ -n "$cid" ] || return 2
            status=$(docker inspect -f \
              '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
              "$cid" 2>/dev/null || echo unknown)
            case "$status" in
              healthy|none) return 0 ;;
              unhealthy) return 1 ;;
              *) return 3 ;;
            esac
          }
          # Long enough to cover the healthcheck's start period and first probes.
          for i in $(seq 1 40); do
            state=$(docker service inspect hivesigner-api_api --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{else}}none{{end}}' 2>/dev/null || echo unknown)
            case "$state" in
              rollback_started|rollback_completed|paused)
                echo "update did not take: $state"
                docker service ps hivesigner-api_api --no-trunc | head -5
                exit 1 ;;
            esac
            # `none` is a NEW service, which has no update status - including
            # while its only task is failing to start. Both paths still have to
            # see a task that is running AND healthy.
            if [ "$state" = "completed" ] || { [ "$state" = "none" ] && running; }; then
              health
              case "$?" in
                0)
                  echo "deploy ok (update state: $state)"
                  docker service ps hivesigner-api_api --filter desired-state=running
                  exit 0 ;;
                1)
                  echo "container is unhealthy"
                  docker service ps hivesigner-api_api --no-trunc | head -5
                  exit 1 ;;
                2)
                  # Task is on another node, so its health cannot be read from
                  # here. Fall back to the update state, which is the best
                  # signal available in that case.
                  if [ "$state" = "completed" ]; then
                    echo "deploy ok (update completed; task not on this node)"
                    exit 0
                  fi ;;
              esac
            fi
            sleep 5
          done
          echo "service did not become healthy in time:"
          docker service ps hivesigner-api_api --no-trunc | head -5
          docker ps --filter "label=com.docker.swarm.service.name=hivesigner-api_api" \
            --format '{{.Names}} {{.Status}}' || true
          exit 1
