version: '3.7'

services:
  api:
    image: ecency/hivesigner-api:latest
    environment:
      - API_PORT
      - BROADCAST_NETWORK
      - BROADCASTER_USERNAME
      - BROADCASTER_POSTING_WIF
    ports:
      - ${API_PORT}:${API_PORT}
    # The app-usage history, which IS the directory. A task's filesystem is
    # thrown away on every deploy, and without this the list would empty itself
    # on each release and take hours of traffic to rebuild.
    volumes:
      - hsapi-data:/var/app/data
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
        # NO max_attempts. With a cap and a single replica, five crashes inside
        # the window left the service down until the next deploy - which for an
        # OAuth API means every app's sign-in stays broken until someone
        # notices. Uncapped restarts are the right trade for a single-replica
        # service whose failure mode is that nobody can sign in anywhere.
        window: 60s

volumes:
  # Local to the node. There is one replica, so there is one node that matters;
  # if that ever changes this needs to become a shared volume or a datastore.
  hsapi-data:
