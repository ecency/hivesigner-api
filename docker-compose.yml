version: '3.7'

services:
  api:
    image: ecency/hivesigner-api:latest
    environment:
      - API_PORT
      - BROADCAST_NETWORK
      - BROADCASTER_USERNAME
      - BROADCASTER_POSTING_WIF
    ports:
      - ${API_PORT}:${API_PORT}
    # The app-usage history. A task's filesystem is thrown away on every deploy,
    # and this is the directory's primary signal, so losing it on each release
    # would leave the list running on the stale on-chain fallbacks for a month
    # while it rebuilt.
    volumes:
      - hsapi-data:/var/app/data
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
        # NO max_attempts. With a cap and a single replica, five crashes inside
        # the window left the service down until the next deploy - which for an
        # OAuth API means every app's sign-in stays broken until someone
        # notices. vision_vapi on EU runs uncapped for the same reason.
        window: 60s

volumes:
  # Local to the node. There is one replica, so there is one node that matters;
  # if that ever changes this needs to become a shared volume or a datastore.
  hsapi-data:
